[project]
name = "human-history"
version = "0.1.0"
description = "Humanized, offline history browser for Claude Code and Codex sessions (Herdr-friendly TUI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=3.0",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.scripts]
human-history = "human_history.cli:app"
hh = "human_history.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/human_history"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF012: Textual's BINDINGS/CSS class attributes are lists by design.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
